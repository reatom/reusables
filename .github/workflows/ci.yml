name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build jsrepo
        run: pnpm jsrepo:build

      # registry.json is regenerated, not hand-edited. On PRs it may be stale
      # (contributors don't commit it) — warn but don't block; a maintainer runs
      # `/rebuild-registry` before merge. On main it must always be in sync.
      - name: Verify registry is up to date
        run: |
          if git diff --exit-code registry.json; then
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::registry.json is out of date. A maintainer should comment /rebuild-registry on this PR before merge."
            exit 0
          fi
          echo "::error::registry.json is out of date on ${{ github.ref_name }}. It must be rebuilt (pnpm jsrepo:build) and committed."
          exit 1

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
