name: Rebuild registry

# Maintainer-triggered rebuild of registry.json on a pull request.
#
# Contributors do NOT commit registry.json. When a PR is ready to merge, a
# maintainer comments `/rebuild-registry` on it. This job checks out the PR head
# branch, regenerates registry.json with `pnpm jsrepo:build`, and pushes the
# result back to the branch so the committed registry matches the items on main
# plus this PR.
#
# Notes:
# - `issue_comment` events always run with the workflow file from the default
#   branch, so this file must be merged to main to take effect.
# - Pushing with the default GITHUB_TOKEN does NOT re-trigger `ci.yml` on the new
#   commit (GitHub suppresses recursive workflow runs). If you require the CI
#   check to re-run on the rebuilt commit before merge, add a repo secret
#   REGISTRY_REBUILD_TOKEN (a PAT or GitHub App token with `contents: write`);
#   the push below uses it when present and falls back to GITHUB_TOKEN otherwise.
# - Only works for same-repo PR branches. The base-repo token cannot push to a
#   fork's branch, so fork contributors must run `pnpm jsrepo:build` locally.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    # PR comment, contains the command, authored by a maintainer.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/rebuild-registry') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: React to the command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_REBUILD_TOKEN || secrets.GITHUB_TOKEN }}
          # issue_comment carries no head ref; check out the PR by number.
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --json headRefName -q .headRefName)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Land on the actual branch ref so we can push back to it.
          git checkout -B "$branch"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild registry
        run: pnpm jsrepo:build

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "registry.json already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: rebuild registry.json"
          git push origin "HEAD:${{ steps.pr.outputs.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            body="✅ Rebuilt \`registry.json\` and pushed to \`${{ steps.pr.outputs.branch }}\`."
          else
            body="ℹ️ \`registry.json\` was already up to date; nothing to push."
          fi
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --body "$body"
