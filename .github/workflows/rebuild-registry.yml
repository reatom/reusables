name: Rebuild registry

# The command deliberately writes to a PR branch. Authorization runs without
# write access, accepts only maintainers and same-repository PRs, and pins the
# exact head. Build and push use separate runners: PR code never runs in the
# write-enabled job, which receives only the generated registry JSON.
# jactionlint ignore=dangerous-triggers
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rebuild-registry-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/rebuild-registry' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Authorize maintainer and resolve immutable PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          permission="$(gh api "repos/$REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo 'Only maintainers with write access may rebuild the registry.'; exit 1 ;;
          esac
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<< "$pr")" = open
          test "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPOSITORY"
          echo "sha=$(jq -r .head.sha <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head.ref <<< "$pr")" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: authorize
    if: needs.authorize.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild registry
        run: pnpm jsrepo:build

      - name: Upload generated registry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-${{ needs.authorize.outputs.sha }}
          path: registry.json
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [authorize, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout authorized PR commit without executing its code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Download generated registry outside the PR checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/registry-artifact

      - name: Validate and copy the generated registry
        env:
          GENERATED_REGISTRY: ${{ runner.temp }}/registry-artifact/registry.json
        run: |
          test -f "$GENERATED_REGISTRY" && test ! -L "$GENERATED_REGISTRY"
          jq -e 'type == "object" and .name == "@reatom/reusables" and .type == "repository" and (.items | type == "array")' "$GENERATED_REGISTRY" > /dev/null
          # Replace a PR-controlled symlink rather than following it.
          rm -f registry.json
          cp "$GENERATED_REGISTRY" registry.json

      - name: Commit and push if the authorized head is still current
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_REBUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_BRANCH: ${{ needs.authorize.outputs.branch }}
          PR_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          if git diff --quiet registry.json; then
            echo 'registry.json already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry.json
          git -c core.hooksPath=/dev/null commit -m 'chore: rebuild registry.json'
          gh auth setup-git
          # The lease rejects a concurrent contributor push, even if it rewrote
          # the branch. Never replace code added after authorization.
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/$PR_BRANCH:$PR_SHA" \
            "https://github.com/$REPOSITORY.git" "HEAD:refs/heads/$PR_BRANCH"
